name: Swift
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Public API tests
        run: swift test
      - name: Native gameplay and offline audio regressions
        run: ruby Tools/test_native_regressions.rb
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: iOS Simulator library
        run: xcodebuild -scheme SimaiSwift -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/simai-swift-library CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Example application
        run: xcodebuild -project Examples/Demo/SimaiDemo.xcodeproj -scheme SimaiDemo -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/simai-swift-demo CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Preview playback and scrubbing
        run: |
          simulator_id=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices")
            phone = devices.select { |runtime, _| runtime.include?(".iOS-") }.values.reverse.flatten
              .find { |device| device.fetch("name").start_with?("iPhone") }
            abort "No iPhone simulator available" unless phone
            puts phone.fetch("udid")
          ')
          xcodebuild -scheme SimaiSwift -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath /tmp/simai-swift-preview-tests -parallel-testing-enabled NO \
            -only-testing:SimaiSwiftTests/PreviewPlaybackTests CODE_SIGNING_ALLOWED=NO test -quiet
